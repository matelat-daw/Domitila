spring.application.name=projects
spring.profiles.default=dev

# Configuracion comun
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=DomitilaHikariPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Atlantic/Canary
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Zona horaria de la aplicacion
spring.jackson.time-zone=Atlantic/Canary

# Archivos
app.upload.dir=${UPLOAD_DIR:${user.home}/Domitila/Empleados}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
security.jwt.expiration-time=900000
security.jwt.refresh-expiration-time=28800000
security.jwt.issuer=${JWT_ISSUER:domitila}
security.jwt.audience=${JWT_AUDIENCE:domitila}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${Email_User}
spring.mail.password=${Email_Pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.org.springframework.security.config.annotation.authentication=ERROR
